name: 🚢 Dev Container Templates

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          ref: ${{ github.ref }}
          filters: |
            python311-node24: 'src/python311-node24/**'
            python313-node24: 'src/python313-node24/**'
            python315-node24: 'src/python315-node24/**'

  test:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.templates != '[]' && needs.detect-changes.outputs.templates != ''
    timeout-minutes: 5
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.detect-changes.outputs.templates) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global @devcontainers/cli@0.89.0
      - run: bash tests/test-${{ matrix.template }}.sh

  publish:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && needs.detect-changes.outputs.templates != '[]' && needs.detect-changes.outputs.templates != ''
    needs: [detect-changes, test]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: devcontainers/action@v1.4.4
        with:
          publish-templates: "true"
          base-path-to-templates: './src'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
